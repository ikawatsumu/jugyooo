server {
    listen       0.0.0.0:80;
    server_name  _;
    charset      utf-8;

    root /var/www/public;

    # 演習2の対策としてここに5MBの制限を追加します
    client_max_body_size 5M;

    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 資料にある正しい画像配信設定です
    location /image/ {
        root /var/www/upload;
    }
}
